# MFMP niche classification — single source of truth.
#
# Per MFMP_Niche_Classification_Criteria.md §9.2, NOTHING in this file may be
# duplicated in Python: every lexicon, commodity code, weight and threshold
# lives here, and adding a seventh niche must be a YAML edit and nothing else.
#
# ─────────────────────────────────────────────────────────────────────────────
# SEED FILE — REVIEW BEFORE TRUSTING THE OUTPUT
#
# The lexicons below were drafted from the criteria document's prose so the
# engine has something to run against. They are a starting point for you to
# correct, not a validated vocabulary. The criteria doc says it plainly (§8):
# "The lexicons will be wrong on day one."
#
# Commodity codes carry `source:` markers:
#   validated                       — confirmed against the MFMP v20 workbook
#   seed_from_existing_catalogue    — taken from commodity_codes.py, which was
#                                     curated for MFMP but never tier-checked
#   candidate_requires_validation   — proposed, unverified (criteria doc §9.6)
#
# Codes marked `candidate_requires_validation` demote to Tier C when a v20
# workbook is configured and does not contain them. With no workbook configured
# validation is skipped with a warning and declared tiers stand — demoting every
# code because the reference file is absent would silently gut the model.
# ─────────────────────────────────────────────────────────────────────────────

version: "2.0"

# §1.1 of the implementation plan. false = one row per bid, in its primary lane
# only (secondary niches recorded in a column). true = the criteria doc's §5
# behaviour, an OWNER row plus a CROSS-LISTED row in every secondary lane.
cross_listing: false

# ── Scoring weights (criteria doc §3) ────────────────────────────────────────
scoring:
  code:                     # §3.1 — C, max 45
    tier_a: 45
    tier_b: 34
    tier_c: 22
    prefix6_of_tier_a: 22
    other_niche_tier_a: 10  # requires this niche's title or scope to fire
    absent: 15              # the load-bearing neutral rule
    unrelated: 0
    max: 45
  title:                    # §3.2 — T, max 25
    core_first: 17
    core_additional: 4      # a second distinct core term, once only
    high_intent_modifier: 4
    umbrella_only: 10       # also sets deep_read_required
    max: 25
  scope:                    # §3.3 — S, max 30
    # Base by count of distinct niche terms (core + supporting); index 4 covers
    # "4 or more".
    base_by_distinct: [0, 8, 15, 22, 26]
    deliverable_bonus: 6
    max: 30

# ── Thresholds (criteria doc §4, §5) ─────────────────────────────────────────
thresholds:
  niche_match: 40           # below this, the niche did not match
  secondary_min: 55         # a secondary lane needs at least this
  secondary_max_gap: 20     # ...and must be within this of the primary
  contested_gap: 8          # primary - runner-up <= this marks it contested
  strength:
    strong: 75
    probable: 55
    possible: 40

# §3.2 — +4 on the title score when any of these accompany a core term.
high_intent_modifiers:
  - services
  - service
  - development
  - develop
  - redesign
  - design services
  - campaign
  - repair
  - maintenance
  - support
  - implementation
  - production
  - consulting
  - solutions

# §5.1 — N6 hard override. Any of these in title or scope takes the primary
# slot outright, even when another niche scores higher. An electronics scope
# filed under Software is the most damaging error this engine can make.
routing:
  hard_primary_override:
    niche: N6
    terms:
      - pcb
      - pcba
      - printed circuit board
      - circuit board
      - controller board
      - schematic
      - schematic capture
      - gerber
      - solder
      - soldering
      - reflow
      - bga
      - smd
      - smt
      - through-hole
      - vfd
      - firmware flashing
      - board repair
      - board-level repair
      - component-level repair
      - reverse engineering board

# ── Tie-breaks (criteria doc §6) ─────────────────────────────────────────────
# Applied when the top two niches are within `contested_gap`, before contested
# marking. `prefer_a` / `prefer_b` name the pair's two sides; whichever side has
# more distinct hits takes the primary slot. `codes_force_b` overrides both.
# `contested_when_tied` leaves the score order alone and flags it for a human
# rather than guessing — used where no keyword list can resolve the question.
tie_breaks:
  N1|N2:
    # Deliverable is assets → N1. Deliverable is audience outcome → N2.
    prefer_a: [logo, logotype, layout, template, brand standards, style guide, artwork, illustration, typography]
    prefer_b: [reach, impressions, media buy, media placement, campaign management, audience, targeting, click-through, engagement rate]
  N1|N3:
    # File creation → N1. Quantities, stock, trim, binding, delivery → N3.
    prefer_a: [design, layout, artwork, concept, mockup]
    prefer_b: [quantity, quantities, paper stock, trim size, bindery, binding, saddle stitch, perfect bound, press run, delivery locations, impressions per, cover stock]
  N2|N3:
    prefer_a: [targeting, strategy, media plan, audience, campaign]
    prefer_b: [print and mail, direct mail quantity, mailing list, postage, fulfilment, fulfillment, press run]
  N1|N4:
    # Working system → N4. Mockups / wireframes / style guide only → N1.
    prefer_a: [mockup, wireframe, style guide, comps, visual concept]
    prefer_b: [build, deploy, implementation, database, api, hosting, integration, source code]
  N4|N5:
    prefer_a: [crud, portal, forms, workflow, content management, cms, web application, user interface]
    prefer_b: [model, model training, inference, llm, large language model, prediction, classification, nlp, natural language processing, computer vision, machine learning]
    # §6 "AI-powered portal → N4 if the portal is the deliverable, N5 if the
    # model is" cannot be settled by keyword lists. When both sides fire and
    # neither dominates, flag rather than guess.
    contested_when_tied: true
    # §6 BI rule — fully deterministic: BI/analytics codes force N5.
    codes_force_b: ["43232314", "80101508"]

